[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-screen"
version = "0.1.0"
description = "Auditable NCBI GEO screening tool for NAFLD bulk transcriptomics datasets"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# Only scripts/plot_screening.py needs this. Kept out of the core dependencies so
# the CLI and its test suite stay on requests alone.
plots = [
    "matplotlib>=3.8",
]

[project.scripts]
geo-screen = "geo_screen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
